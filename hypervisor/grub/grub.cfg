set timeout=3
set default=0

# ------------------------------------------------------------------
# GRUB authentication (TEMPLATE — must be replaced before deployment)
#
# Generate a real hash:
#   grub-mkpasswd-pbkdf2 --iteration-count=100000
# Then replace the placeholder line below with the output.
#
# CI gate: build must reject any grub.cfg containing "PLACEHOLDER_"
# ------------------------------------------------------------------
set superusers="admin"
password_pbkdf2 admin grub.pbkdf2.sha512.100000.68617AE1C9366BD3334DB4C469AACD74C60DAA10EC73007E14E77ED4795B6A588505AFA43E4CDFC229F5C4737DC095DE7063A6DB30CDA4266F0EF80C13828571.CE1F2F4B9DB1D5AB323089694FF98FDB399E571910612B3BF6895188638DE8B4863E53BFDA4FDD6F557B891A3E311D5E387805E3025A366E1307583C4C7F014A

serial --unit=0 --speed=115200 --word=8 --parity=no --stop=1
terminal_input console serial
terminal_output console serial

menuentry "FBVBS Microhypervisor" --unrestricted {
    multiboot2 /boot/fbvbs-baremetal.elf
    module2 /boot/fbvbs-artifact-1000.bin artifact:0x1000
    module2 /boot/fbvbs-artifact-1100.bin artifact:0x1100
    module2 /boot/fbvbs-artifact-1200.bin artifact:0x1200
    module2 /boot/fbvbs-artifact-1300.bin artifact:0x1300
    module2 /boot/fbvbs-artifact-1400.bin artifact:0x1400
    module2 /boot/fbvbs-artifact-1500.bin artifact:0x1500
    module2 /boot/fbvbs-artifact-1600.bin artifact:0x1600
    module2 /boot/fbvbs-artifact-3000.bin artifact:0x3000
    module2 /boot/fbvbs-artifact-3700.bin artifact:0x3700
    boot
}
