# FBVBS Continuous Integration Pipeline
#
# This workflow is producer-facing for the standalone microhypervisor.
# It intentionally tests and archives the repository state needed to ship
# `hypervisor/` independently from the future FBVBS service stack.

name: FBVBS CI

on:
  push:
    branches: [main, dev]
    tags:
      - 'hypervisor-v*'
    paths:
      - '.github/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'RELEASE.md'
      - 'SECURITY.md'
      - 'hypervisor/**'
      - 'plan/**'
  pull_request:
    branches: [main, dev]
    paths:
      - '.github/**'
      - '.gitignore'
      - '.gitattributes'
      - '.editorconfig'
      - 'README.md'
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - 'RELEASE.md'
      - 'SECURITY.md'
      - 'hypervisor/**'
      - 'plan/**'
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CC: gcc-13

jobs:
  static-analysis:
    name: GCC -fanalyzer + cppcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-13 cppcheck

      - name: GCC -fanalyzer
        run: make -C hypervisor analyze CC=gcc-13

      - name: cppcheck
        run: make -C hypervisor cppcheck CC=gcc-13

  unit-tests:
    name: Unit tests (8 suites)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-13

      - name: Build and run tests
        run: make -C hypervisor test CC=gcc-13

  fuzz-build:
    name: Fuzz harness build + smoke (6 harnesses)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-13

      - name: Build fuzz harnesses
        run: make -C hypervisor fuzz-build CC=gcc-13

      - name: Run fuzz smoke corpus
        run: make -C hypervisor fuzz-smoke CC=gcc-13

      - name: Run fuzz campaign (60s per harness)
        run: make -C hypervisor fuzz-campaign CC=gcc-13

      - name: Triage any crashes
        if: failure()
        run: make -C hypervisor fuzz-triage CC=gcc-13

      - name: Upload fuzz binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fuzz-binaries
          path: |
            hypervisor/build/fuzz_command_page
            hypervisor/build/fuzz_manifest
            hypervisor/build/fuzz_multiboot2
            hypervisor/build/fuzz_iommu
            hypervisor/build/fuzz_log_decoder
            hypervisor/build/fuzz_partition_loader
            hypervisor/build/fuzz-smoke.txt

  coverage:
    name: Coverage evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-13

      - name: Build and run with coverage
        run: |
          make -C hypervisor coverage CC=gcc-13 | tee hypervisor/build/coverage-summary.txt

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-artifacts
          path: |
            hypervisor/build/coverage-summary.txt
            hypervisor/build/*.gcov
            hypervisor/build/*.gcda
            hypervisor/build/*.gcno

  reproducible-build:
    name: Reproducible build + SBOM
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-13

      - name: Verify deterministic build
        run: make -C hypervisor reproducible CC=gcc-13

      - name: Generate SBOM
        run: make -C hypervisor sbom CC=gcc-13

      - name: Generate provenance metadata
        run: make -C hypervisor provenance CC=gcc-13

      - name: Upload reproducibility artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reproducibility-artifacts
          path: |
            hypervisor/build/repro_manifest_1.sha256
            hypervisor/build/repro_manifest_2.sha256
            hypervisor/build/sbom.txt
            hypervisor/build/provenance.json

  baremetal-smoke:
    name: Bare-metal GRUB/QEMU smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-13 qemu-system-x86 grub-pc-bin grub-common xorriso mtools

      - name: Build and run QEMU smoke matrix
        run: make -C hypervisor run-qemu-matrix CC=gcc-13

      - name: Upload bare-metal artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: baremetal-artifacts
          path: |
            hypervisor/build/fbvbs-baremetal.elf
            hypervisor/build/fbvbs-baremetal.iso
            hypervisor/build/qemu-smoke.log
            hypervisor/build/qemu-smoke-summary.txt
            hypervisor/build/qemu-iommu-summary.txt
            hypervisor/build/qemu-matrix-summary.txt
            hypervisor/build/qemu-smoke-logs

  traceability:
    name: Requirement traceability
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check requirement traceability
        run: |
          mkdir -p hypervisor/build
          python3 hypervisor/tools/traceability_matrix.py | tee hypervisor/build/traceability.txt
          if grep -qi "no source reference" hypervisor/build/traceability.txt; then
            echo "FAIL: Some requirements have no source reference"
            grep -i "no source reference" hypervisor/build/traceability.txt
            exit 1
          fi

      - name: Upload traceability report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: traceability-report
          path: hypervisor/build/traceability.txt

  frama-c-wp:
    name: Frama-C WP formal proof
    runs-on: ubuntu-24.04
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/hypervisor-v') || github.event_name == 'pull_request'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Install opam and Frama-C
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y opam z3
          opam init --auto-setup --disable-sandboxing -y
          opam install frama-c alt-ergo -y

      - name: Run WP proof
        run: |
          eval $(opam env)
          mkdir -p hypervisor/build
          make -C hypervisor proof 2>&1 | tee hypervisor/build/frama-c-wp.log

      - name: Run per-file WP shards
        run: |
          eval $(opam env)
          make -C hypervisor proof-shards PROOF_SHARD_TIMEOUT=600 2>&1 | tee hypervisor/build/frama-c-shards.log

      - name: Upload WP log
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: frama-c-wp-log
          path: |
            hypervisor/build/frama-c-wp.log
            hypervisor/build/frama-c-shards.log
            hypervisor/build/proof-shards/
            hypervisor/build/proof-shards-summary.txt

  release-gate:
    name: Release gate (all checks)
    runs-on: ubuntu-24.04
    if: always()
    needs:
      - static-analysis
      - unit-tests
      - fuzz-build
      - coverage
      - reproducible-build
      - baremetal-smoke
      - traceability
    timeout-minutes: 5
    steps:
      - name: Verify all required gates passed
        run: |
          echo "Checking required gate results..."
          results='${{ toJSON(needs) }}'
          echo "$results" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          failed = [k for k, v in needs.items() if v['result'] != 'success']
          if failed:
              print(f'FAIL: Required gates failed: {failed}')
              sys.exit(1)
          print(f'PASS: All {len(needs)} required gates succeeded.')
          "
